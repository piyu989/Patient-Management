spring.application.name=analytic

# Standard property used by grpc-spring-boot-starter
grpc.server.port=9010

# Custom properties if your code explicitly reads them
billing.grpc.server.port=9010
billing.grpc.server.address=localhost

debug=true
server.port=4003

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer